# Construit les installeurs KAYZEN Flux (Windows, macOS, Linux) et l'extension navigateur.
# Déclenchement : pousser une étiquette « v1.2.3 » ou lancer manuellement depuis l'onglet Actions.
#
# Secrets à créer dans le dépôt (Settings > Secrets and variables > Actions) :
#   (facultatif) KAYZEN_LICENSE_PUBLIC_KEY_TS  remplace apps/daemon/src/license-key.ts ; sinon la clé publique
#                 de production déjà présente dans le dépôt est utilisée (le build refuse une clé de développement).
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD               certificat de signature Windows (.pfx en base64)
#   CSC_LINK, CSC_KEY_PASSWORD                       certificat « Developer ID Application » Apple (.p12 en base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  notarisation Apple
# Sans certificats, les installeurs sont produits mais non signés (avertissements Windows SmartScreen / macOS Gatekeeper).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && pipx install yt-dlp
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  desktop:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Clé publique de licence de production
        shell: bash
        env:
          KEY_TS: ${{ secrets.KAYZEN_LICENSE_PUBLIC_KEY_TS }}
        run: |
          if [ -n "$KEY_TS" ]; then printf '%s\n' "$KEY_TS" > apps/daemon/src/license-key.ts; fi
          grep -q "LICENSE_KEY_IS_DEV = false" apps/daemon/src/license-key.ts || { echo "::error::Clé de licence de développement : lancer « node tools/license.mjs keygen »"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kayzen-flux/ui build
      - name: Installeurs
        run: pnpm --filter @kayzen-flux/desktop ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: kayzen-flux-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  extension:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kayzen-flux/extension package
      - uses: actions/upload-artifact@v4
        with:
          name: kayzen-flux-extension
          path: apps/extension/release/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Brouillon de version GitHub (à relire puis publier manuellement)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
