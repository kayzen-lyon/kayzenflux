# Construit les installeurs KAYZEN Flux (Windows, macOS, Linux) et l'extension navigateur.
# Déclenchement : pousser une étiquette « v1.2.3 » ou lancer manuellement depuis l'onglet Actions.
#
# Secrets facultatifs (Settings > Secrets and variables > Actions) :
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD               certificat de signature Windows (.pfx en base64)
#   CSC_LINK, CSC_KEY_PASSWORD                       certificat « Developer ID Application » Apple (.p12 en base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  notarisation Apple
# Sans certificats, les installeurs sont produits mais non signés (avertissements Windows SmartScreen / macOS Gatekeeper).
# Signature Windows gratuite possible pour un projet open source : SignPath Foundation (voir docs/MISE-EN-PRODUCTION.md).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft_release:
        description: Créer un brouillon de version GitHub avec les installeurs
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg && pipx install yt-dlp
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  desktop:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kayzen-flux/ui build
      - name: Installeurs
        shell: bash
        # Les variables de signature ne sont exportées que si le secret existe :
        # une variable vide (ex. CSC_LINK="") ferait échouer electron-builder.
        env:
          S_CSC_LINK: ${{ secrets.CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          S_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          S_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            val="S_$v"; if [ -n "${!val}" ]; then export "$v=${!val}"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          pnpm --filter @kayzen-flux/desktop ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: kayzen-flux-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  extension:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kayzen-flux/extension package
      - uses: actions/upload-artifact@v4
        with:
          name: kayzen-flux-extension
          path: apps/extension/release/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.draft_release)
    needs: [desktop, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Brouillon de version GitHub (à relire puis publier manuellement)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          name: KAYZEN Flux ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
