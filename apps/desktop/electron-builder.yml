appId: fr.kayzen.flux
productName: KAYZEN Flux
executableName: kayzen-flux
copyright: Copyright © 2026 KAYZEN — Tarek Belhadj
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - build/icon.png
extraResources:
  - from: ../ui/dist
    to: ui
  - from: ../../THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
  - from: ../../LICENSE
    to: LICENSE.txt
protocols:
  - name: KAYZEN Flux
    schemes: [kayzenflux]
asar: true
artifactName: kayzen-flux-${version}-${os}-${arch}.${ext}
# Outils embarqués (yt-dlp, ffmpeg, Deno) : un dossier par plateforme cible.
# Ne pas utiliser ${platform} dans extraResources : il vaut la plateforme de la
# machine qui construit, ce qui embarquait les binaires Linux dans l'installeur
# Windows lors d'une construction croisée.
linux:
  extraResources:
    - from: sidecars/linux-${arch}
      to: bin
  target: [AppImage, deb]
  maintainer: KAYZEN <contact@kayzen-lyon.fr>
  vendor: KAYZEN
  category: AudioVideo
  icon: build/icon.png
  synopsis: Téléchargeur et convertisseur multimédia local, sans publicité
  mimeTypes: [x-scheme-handler/kayzenflux]
deb:
  packageName: kayzen-flux
  depends: [libnss3, libgtk-3-0]
win:
  extraResources:
    - from: sidecars/win32-${arch}
      to: bin
  target: [nsis]
  icon: build/icon.png
  # Signature : renseigner CSC_LINK / CSC_KEY_PASSWORD (certificat de signature de code) dans la CI.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  language: '1036'
  shortcutName: KAYZEN Flux
mac:
  extraResources:
    - from: sidecars/darwin-${arch}
      to: bin
  # zip : requis par la mise à jour automatique sous macOS (le .dmg sert à la première installation).
  target: [dmg, zip]
  icon: build/icon.png
  category: public.app-category.video
  hardenedRuntime: true
  # Notarisation : renseigner APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID dans la CI.
# Mise à jour automatique (electron-updater) : fournisseur « generic ».
# electron-builder écrit cette adresse dans resources/app-update.yml (lu par src/updater.ts) et
# produit latest.yml / latest-mac.yml / latest-linux.yml (+ .blockmap) à déposer à cette adresse
# avec les installeurs. Autre adresse : electron-builder -c.publish.url=https://exemple.fr/maj/
# L'application refuse toute adresse non https et ne vérifie qu'avec l'accord de l'utilisateur.
# Les installeurs ne sont jamais envoyés automatiquement (scripts dist:* : --publish never).
publish:
  provider: generic
  url: https://flux.kayzen-lyon.com/updates/
